name: Build Standalone & Verify M3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "starforge_ark_cradle.html"
      - "dist/**"

permissions:
  contents: write

jobs:
  build-and-bundle:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node scripts/polish_m3.mjs
      - run: node scripts/upgrade_v3.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Run E2E verification
        run: |
          npx vite preview --host 127.0.0.1 --port 5173 &
          PREVIEW_PID=$!
          node -e "const n=require('net');const w=()=>{const s=n.connect(5173,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>setTimeout(w,300))};w()"
          npm run test:e2e
          kill $PREVIEW_PID || true
      - name: Commit updated M3 sources and standalone HTML bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f starforge_ark_cradle.html dist/starforge_ark_cradle.html
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(v3): upgrade monster & tower 3D details, impact VFX, targeting priorities & wave intel, and bundle starforge_ark_cradle.html [skip ci]"
            git push origin HEAD:main
          fi
